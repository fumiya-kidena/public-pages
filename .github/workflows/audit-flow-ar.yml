name: Audit FLOW AR deployment

on:
  push:
    branches: [gh-pages]
    paths:
      - ".nojekyll"
      - "index.html"
      - "flow-ar/**"
      - "_p/flow-ar/**"
      - ".github/script/auditFlowArDeploy.mjs"
      - ".github/workflows/audit-flow-ar.yml"
  pull_request:
    paths:
      - ".nojekyll"
      - "index.html"
      - "flow-ar/**"
      - "_p/flow-ar/**"
      - ".github/script/auditFlowArDeploy.mjs"
      - ".github/workflows/audit-flow-ar.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/script/auditFlowArDeploy.mjs
