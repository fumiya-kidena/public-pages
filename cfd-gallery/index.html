<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFD Gallery</title>
<style>
  :root{
    --bg:#0c0d10; --line:#25272e; --ink:#e9e9ec; --mut:#8b8f9a; --dim:#5b5f6a;
    --accent:#6fd6c8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;}
  .wrap{max-width:1120px;margin:0 auto;padding:64px 28px 120px;}
  header{margin-bottom:56px;}
  .kicker{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);font-weight:600;}
  header h1{margin:14px 0 0;font-size:44px;font-weight:200;letter-spacing:.02em;}
  header .sub{color:var(--mut);font-size:14px;margin-top:10px;max-width:52ch;}
  .sec{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
    border-bottom:1px solid var(--line);padding-bottom:12px;margin:40px 0 26px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:34px 30px;}
  figure{margin:0;}
  .frame{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;
    border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.45);transition:transform .25s ease,box-shadow .25s ease;}
  .frame:hover{transform:translateY(-4px);box-shadow:0 26px 64px rgba(0,0,0,.6);}
  .frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;}
  figcaption{margin-top:15px;}
  .ttl{font-size:17px;font-weight:500;letter-spacing:.01em;}
  .meth{display:inline-block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);border:1px solid #2c3a38;background:#12201d;border-radius:20px;padding:2px 11px;margin-left:2px;vertical-align:2px;}
  .cite{color:var(--mut);font-size:12.5px;margin-top:9px;line-height:1.65;}
  .cite a{color:var(--mut);text-decoration:none;border-bottom:1px solid #33363d;}
  .cite a:hover{color:var(--ink);border-bottom-color:var(--accent);}
  .doi{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--dim);}
  .lic{display:inline-block;font-size:10px;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);
    border-radius:4px;padding:1px 6px;margin-top:7px;}
  .empty{border:1px dashed #2b2e36;border-radius:14px;padding:60px 24px;text-align:center;color:var(--dim);
    font-size:14px;letter-spacing:.02em;}
  footer{margin-top:80px;padding-top:22px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;
    display:flex;gap:22px;flex-wrap:wrap;}
  footer a{color:var(--mut);text-decoration:none;border-bottom:1px solid #33363d;}
  footer a:hover{color:var(--ink);}
  @media(max-width:520px){header h1{font-size:32px}.grid{grid-template-columns:1fr}.wrap{padding:44px 18px 90px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>CFD Gallery</h1>
</header>

<div class="sec">Free-surface &amp; ocean</div>
<div class="grid">
  <figure>
    <div class="frame">
      <iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/nt9BohngvoE" title="Adaptive Phase-Field-FLIP"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <figcaption>
      <div class="ttl">Adaptive Phase-Field-FLIP — very large-scale two-phase fluid <span class="meth">PF-FLIP · adaptive</span></div>
      <div class="cite">Braun, Bender &amp; Thürey — <em>ACM Trans. Graph.</em> (2025). <a href="https://doi.org/10.1145/3730854" target="_blank" rel="noopener">doi:10.1145/3730854</a> ·
        <a href="https://www.youtube.com/watch?v=nt9BohngvoE" target="_blank" rel="noopener">YouTube · Nils Thuerey</a></div>
    </figcaption>
  </figure>
</div>

<footer>
  <a href="sources.html">sources</a>
</footer>

</div>
</body>
</html>
