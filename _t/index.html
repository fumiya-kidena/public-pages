<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FLOW AR · Test Box</title>
</head>
<body>
  <p><a href="lab/?card=testBox">Test Boxを開く</a></p>
  <script>
    const target = new URL("lab/", location.href);
    target.search = location.search;
    if (!target.searchParams.has("card")) target.searchParams.set("card", "testBox");
    // Test Box has no research unlock token; do not forward a copied fragment.
    location.replace(target.href);
  </script>
</body>
</html>
